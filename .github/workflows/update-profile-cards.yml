name: Opdater profilkort

on:
  schedule:
    - cron: "17 3 * * *" # Hver nat
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-profile-cards.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats-kort
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=holi&show_icons=true&title_color=cad404&icon_color=cad404&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top-sprog-kort
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=holi&title_color=cad404&hide_border=true&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Trofæer
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          theme: gitdimmed
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit kort
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Opdater profilkort" || exit 0
          git push
